# docker-compose para el pipeline CDC
# Levanta: Zookeeper + Kafka + Kafka Connect (con Debezium) + Kafka UI + GraphDB
#
# Uso:
#   docker compose up -d
#   (esperar ~30s a que arranque todo)
#   ./register-connector.sh
#
# Postgres NO va en Docker: corre en la maquina local (localhost). Los contenedores lo
# alcanzan por "host.docker.internal" (ver el connector json).
#
# Kafka expone DOS listeners:
#   - INTERNAL (kafka:29092): lo usan los contenedores (Connect, Kafka UI).
#   - EXTERNAL (localhost:9092): lo usa el consumer.py que corre en la maquina local.
# Esto es lo que permite que el consumer del host se conecte sin el error de
# "advertised listeners" (que anunciaba una IP interna inalcanzable).

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: memorias-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: memorias-kafka
    depends_on: [zookeeper]
    ports:
      - "9092:9092"        # listener EXTERNAL, para el consumer que corre en el host
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  connect:
    image: quay.io/debezium/connect:2.7
    container_name: memorias-connect
    depends_on: [kafka]
    ports:
      - "8083:8083"
    # Permite que el contenedor resuelva la Postgres del host (si sería en Linux.
    # Ya que en Docker Desktop Windows/Mac host.docker.internal ya funciona por defecto).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092          # listener INTERNAL
      GROUP_ID: memorias-connect-group
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: memorias-kafka-ui
    depends_on: [kafka, connect]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: memorias
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092   # listener INTERNAL
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083

  graphdb:
    image: ontotext/graphdb:10.7.0
    container_name: memorias-graphdb
    ports:
      - "7200:7200"
    volumes:
      - graphdb-data:/opt/graphdb/home

volumes:
  graphdb-data:
